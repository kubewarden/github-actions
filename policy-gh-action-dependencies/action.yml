name: "kubewarden-policy-gh-action-dependencies"
description: "Install all the binaries needed inside of GH action"
branding:
  icon: "package"
  color: "blue"
runs:
  using: "composite"
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Install kwctl
      uses: kubewarden/github-actions/kwctl-installer@470a5a72c2a84792feba99275b024a46d5812f55
    - name: Install bats
      run: sudo apt install -y bats
      shell: bash
    - name: Install SBOM generator tool
      uses: kubewarden/github-actions/syft-installer@470a5a72c2a84792feba99275b024a46d5812f55
    - name: Install binaryen tool
      uses: kubewarden/github-actions/binaryen-installer@470a5a72c2a84792feba99275b024a46d5812f55
