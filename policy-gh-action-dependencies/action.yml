name: "kubewarden-policy-gh-action-dependencies"
description: "Install all the binaries needed inside of GH action"
branding:
  icon: "package"
  color: "blue"
runs:
  using: "composite"
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Install kwctl
      uses: kubewarden/github-actions/kwctl-installer@9a4b4527e6f9f159147720be2b2b5d6c09cef2bd
    - name: Install bats
      run: sudo apt install -y bats
      shell: bash
    - name: Install SBOM generator tool
      uses: kubewarden/github-actions/syft-installer@9a4b4527e6f9f159147720be2b2b5d6c09cef2bd
    - name: Install binaryen tool
      uses: kubewarden/github-actions/binaryen-installer@9a4b4527e6f9f159147720be2b2b5d6c09cef2bd
