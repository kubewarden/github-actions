name: Tests and linters

on:
  workflow_call:
    inputs:
      policy-working-dir:
        description: "working directory of the policy. Useful for repos with policies in folders"
        required: false
        type: string
        default: .
    secrets: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install opa
        uses: kubewarden/github-actions/opa-installer@9a4b4527e6f9f159147720be2b2b5d6c09cef2bd
      - name: Run unit tests
        working-directory: ${{ inputs.policy-working-dir }}
        run: make test
