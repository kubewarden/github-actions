name: Container release

# Reusable workflow. Builds, signs, and attests the container images of one
# Kubewarden component. Every Kubewarden project calls this workflow from its
# own release workflow.
#
# Why this is a reusable workflow and not a composite action:
# a reusable workflow runs as its own job, with its own OIDC token. The token
# names this file in `job_workflow_ref`. The caller never holds that token.
# `actions/attest` below writes the SLSA provenance from that token. A build
# step in the caller cannot forge it. That is what moves the images from SLSA
# Build L2 to L3.
#
# Identity: every signature and attestation this workflow produces carries the
# signer identity
#   https://github.com/kubewarden/github-actions/.github/workflows/container-release.yml@<ref>
# The `cosign verify` steps below check that identity. They hard-code the
# repository name on purpose. Inside a reusable workflow the `github` context
# describes the caller, so nothing in the context names this file.

# No default token permissions. Each job declares exactly what it needs.
permissions: {}

on:
  workflow_call:
    inputs:
      components:
        description: |
          JSON array of component names, for example '["controller","agent"]'.
          Each component has a Dockerfile named `Dockerfile.<component>`.
        required: true
        type: string
      image-namespace:
        description: |
          Path under ghcr.io/<owner>/ where the images live. The image for a
          component becomes ghcr.io/<owner>/<image-namespace>/<component>.
        required: true
        type: string
      dockerfile-dir:
        description: Directory that holds the Dockerfile.<component> files.
        required: false
        type: string
        default: "."
      version:
        description: |
          Release tag, for example v1.2.3. When set, the images get this tag
          and the `attest` job produces the signed SBOM and provenance files
          for the GitHub release. When empty, the images get the tag `latest`
          and the `attest` job does not run.
        required: false
        type: string
        default: ""
      tag:
        description: |
          Image tag to push. Overrides the default (`version`, or `latest`
          when `version` is empty). Use it for branch builds that need a tag
          other than `latest`, for example `latest-feat-foo`. It does not
          turn on the `attest` job.
        required: false
        type: string
        default: ""
      artifact-prefix:
        description: |
          Prefix for the release asset file names, for example
          "RuntimeEnforcer-". The default is no prefix.
        required: false
        type: string
        default: ""

env:
  SIGNER_IDENTITY_REGEXP: '^https://github\.com/kubewarden/github-actions/\.github/workflows/container-release\.yml@'
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    name: Build ${{ matrix.component }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read # Checkout the caller's source
      packages: write # Push images to ghcr.io
      id-token: write # Sign images with cosign
      attestations: write # actions/attest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout the caller's source
        # In a reusable workflow, checkout defaults to the caller's repository
        # and ref. That is the source we want to build.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAMESPACE: ${{ inputs.image-namespace }}
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "name=ghcr.io/${OWNER}/${NAMESPACE}/${COMPONENT}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile-dir }}/Dockerfile.${{ matrix.component }}
          build-args: |
            VERSION=${{ inputs.version || 'dev' }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.image.outputs.name }}

      # Two signature formats. Some verifiers (slsactl, hauler, older cosign)
      # read only the v2 format. Newer cosign reads the v3 bundle format.
      - name: Sign image (cosign v2 signature format)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "${IMAGE}@${DIGEST}"

      - name: Sign image (cosign v3 signature format)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=true --use-signing-config=true \
            "${IMAGE}@${DIGEST}"

      - name: Verify image signature
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer="${OIDC_ISSUER}" \
            --certificate-identity-regexp="${SIGNER_IDENTITY_REGEXP}" \
            "${IMAGE}@${DIGEST}"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build-image.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST}" > "${RUNNER_TEMP}/digests/${COMPONENT}-${ARCH}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          retention-days: 1

  merge:
    name: Merge ${{ matrix.component }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}
    permissions:
      contents: read
      packages: write # Push the multi-arch manifest and the attestation referrer
      id-token: write # Sign with cosign, attest with actions/attest
      attestations: write # actions/attest
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute image name and tag
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAMESPACE: ${{ inputs.image-namespace }}
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ inputs.version }}
          TAG_OVERRIDE: ${{ inputs.tag }}
        run: |
          echo "name=ghcr.io/${OWNER}/${NAMESPACE}/${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_OVERRIDE:-${VERSION:-latest}}" >> "$GITHUB_OUTPUT"

      - name: Create and push the multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -e

          amd64_digest=$(cat "${COMPONENT}-amd64.txt")
          arm64_digest=$(cat "${COMPONENT}-arm64.txt")

          # Compute the expected manifest without pushing
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}@${amd64_digest}" \
            "${IMAGE}@${arm64_digest}" \
            --dry-run > expected-multi-arch-manifest.json

          # Create and push the manifest
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}@${amd64_digest}" \
            "${IMAGE}@${arm64_digest}"

          # imagetools does not print the digest of the pushed manifest.
          # Fetch it back and check it matches what we expected before we
          # sign it.
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw > multi-arch-manifest.json
          multi_arch_manifest_digest="sha256:$(sha256sum multi-arch-manifest.json | awk '{print $1}')"

          expected_digest="sha256:$(jq -S -c . expected-multi-arch-manifest.json | sha256sum | awk '{print $1}')"
          actual_digest="sha256:$(jq -S -c . multi-arch-manifest.json | sha256sum | awk '{print $1}')"

          if [ "$expected_digest" != "$actual_digest" ]; then
            echo "Error: the pushed manifest does not match the expected manifest"
            exit 1
          fi

          echo "digest=${multi_arch_manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Sign manifest (cosign v2 signature format)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "${IMAGE}@${DIGEST}"

      - name: Sign manifest (cosign v3 signature format)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=true --use-signing-config=true \
            "${IMAGE}@${DIGEST}"

      - name: Verify manifest signature
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer="${OIDC_ISSUER}" \
            --certificate-identity-regexp="${SIGNER_IDENTITY_REGEXP}" \
            "${IMAGE}@${DIGEST}"

      # This step moves the image to SLSA Build L3.
      # actions/attest writes the provenance from this job's OIDC token. It
      # reads nothing from disk except the digest we pass. GitHub's Sigstore
      # signs it. The result is stored next to the image as an OCI referrer
      # and in the caller repository's attestation list.
      - name: Attest build provenance (SLSA L3)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  attest:
    name: Release assets ${{ matrix.component }} (${{ matrix.arch }})
    needs: [merge]
    # Only a tagged release ships SBOM and provenance files as assets.
    if: ${{ inputs.version != '' }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write # Read the attestation manifests from ghcr.io
      id-token: write # Sign the files with cosign
    runs-on: ubuntu-latest
    env:
      CRANE_VERSION: v0.20.5
      CRANE_CHECKSUM: ad4cd9af2568c62c97e346de6d1295ee8c6ce3341f7b71cf02d41292b4532680
      COMPONENT: ${{ matrix.component }}
      ARCH: ${{ matrix.arch }}
      PREFIX: ${{ inputs.artifact-prefix }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # crane is installed inline on purpose. A `uses: ./<action>` reference
      # in a reusable workflow resolves against the caller's checkout, not
      # this repository, so tools are installed inline.
      - name: Install crane
        run: |
          set -e
          INSTALL_DIR="$HOME/.crane"
          mkdir -p "$INSTALL_DIR"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o "$INSTALL_DIR/crane.tar.gz"
          echo "${CRANE_CHECKSUM} $INSTALL_DIR/crane.tar.gz" | sha256sum -c
          tar xf "$INSTALL_DIR/crane.tar.gz" -C "$INSTALL_DIR"
          rm "$INSTALL_DIR/crane.tar.gz"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true

      - name: Compute image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAMESPACE: ${{ inputs.image-namespace }}
        run: |
          echo "name=ghcr.io/${OWNER}/${NAMESPACE}/${COMPONENT}" >> "$GITHUB_OUTPUT"

      - name: Find the BuildKit attestation layers
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -e
          DIGEST=$(cat "${COMPONENT}-${ARCH}.txt")

          ATTESTATION_MANIFEST_DIGEST=$(crane manifest "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[]
              | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
              | .digest')

          PROVENANCE_DIGEST=$(crane manifest "${IMAGE}@${ATTESTATION_MANIFEST_DIGEST}" \
            | jq -r '.layers[]
              | select(.annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1")
              | .digest')

          SBOM_DIGEST=$(crane manifest "${IMAGE}@${ATTESTATION_MANIFEST_DIGEST}" \
            | jq -r 'first(.layers[]
              | select(.annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")
              | .digest)')

          {
            echo "PROVENANCE_DIGEST=${PROVENANCE_DIGEST}"
            echo "SBOM_DIGEST=${SBOM_DIGEST}"
          } >> "$GITHUB_ENV"

      # The file names follow the ossf scorecard "Signed-Releases" check:
      # https://github.com/ossf/scorecard/blob/main/docs/checks.md#signed-releases
      - name: Download the SBOM and the provenance
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -e
          crane blob "${IMAGE}@${PROVENANCE_DIGEST}" \
            > "${PREFIX}${COMPONENT}-attestation-${ARCH}-provenance.intoto.jsonl"
          crane blob "${IMAGE}@${SBOM_DIGEST}" \
            > "${PREFIX}${COMPONENT}-attestation-${ARCH}-sbom.json"

      - name: Sign and verify the SBOM and the provenance
        run: |
          set -e
          for file in \
            "${PREFIX}${COMPONENT}-attestation-${ARCH}-provenance.intoto.jsonl" \
            "${PREFIX}${COMPONENT}-attestation-${ARCH}-sbom.json"; do
            cosign sign-blob --yes --bundle "${file}.bundle.sigstore" "${file}"
            cosign verify-blob \
              --bundle "${file}.bundle.sigstore" \
              --certificate-oidc-issuer="${OIDC_ISSUER}" \
              --certificate-identity-regexp="${SIGNER_IDENTITY_REGEXP}" \
              "${file}"
          done

      - name: Upload the signed files as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-${{ inputs.artifact-prefix }}${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ inputs.artifact-prefix }}${{ matrix.component }}-attestation-${{ matrix.arch }}*
